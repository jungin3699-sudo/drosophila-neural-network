name: Publish Fly Maze
on:
  push:
    branches:
      - main
    paths:
      - "Fly_Maze/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Fly Maze site
        uses: actions/upload-pages-artifact@v4
        with:
          path: Fly_Maze
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
